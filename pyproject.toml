[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "company-os"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1",
  "openai==3.16.2", "anthropic==1.7.0", "httpx2==2.13.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-tools>=7.4,<8"]

[tool.hatch.build.targets.wheel]
packages = ["packages/company_os", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["database/migrations", "tests", ".venv"]
