name: Phase 2 foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    name: foundation-required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ephemeral-ci
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Generate ephemeral configuration and install locked backend
        run: npm run setup
      - name: Configure CI database credentials
        env:
          CI_PG_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ephemeral-ci
        run: node scripts/ci-env.mjs
      - name: Bootstrap, migrate and seed
        run: node scripts/ci-services.mjs prepare
      - name: Foundation acceptance checks
        run: npm run check
      - name: Dependency security scan
        run: npm audit --audit-level=moderate
      - name: Production console build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser demonstration
        run: node scripts/ci-services.mjs e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-2-test-evidence
          path: test-results/
